name: GitHub Actions Security Analysis

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
      - "renovate/**"
    paths:
      - ".github/workflows/**"

jobs:
  zizmor:
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    uses: luxass/shared-workflows/.github/workflows/reusable-ci-security.yaml@411fe8f8a0a53eab5153356ac5e0f174cd245eb2 # v0.17.1
    with:
      min-severity: medium
