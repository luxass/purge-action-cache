name: CI Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

defaults:
  run:
    shell: bash

# Age tests delete caches on the current ref. Do not overlap runs on that ref.
concurrency:
  group: cache-tests-${{ github.ref }}

jobs:
  test-normal-mode-time-based:
    name: Test normal mode (time-based)
    runs-on: ubuntu-latest
    if: github.repository_owner == 'luxass' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: write
    env:
      OLD_CACHE_KEY: test-cache-old-${{ github.run_id }}-${{ github.run_attempt }}
      NEW_CACHE_KEY: test-cache-new-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: create old test cache
        run: echo old-cache > old-file.txt

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: old-file.txt
          key: ${{ env.OLD_CACHE_KEY }}

      - name: wait for the old cache to age
        run: sleep 30

      - name: create new test cache
        run: echo new-cache > new-file.txt

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: new-file.txt
          key: ${{ env.NEW_CACHE_KEY }}

      - name: verify old cache exists before purging
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$OLD_CACHE_KEY" --json key |
            jq -e --arg key "$OLD_CACHE_KEY" 'any(.[]; .key == $key)'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: purge old caches (older than 25 seconds)
        uses: ./
        with:
          mode: normal
          debug: "true"
          max-age: 25
          filter-key: last_accessed_at
          ref-key: ${{ github.ref }}

      - name: verify old cache was deleted and new cache still exists
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$OLD_CACHE_KEY" --json key |
            jq -e --arg key "$OLD_CACHE_KEY" 'all(.[]; .key != $key)'
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$NEW_CACHE_KEY" --json key |
            jq -e --arg key "$NEW_CACHE_KEY" 'any(.[]; .key == $key)'
        env:
          GH_TOKEN: ${{ github.token }}

  test-normal-mode-created-at-filter:
    name: Test normal mode with created_at filter
    runs-on: ubuntu-latest
    needs: test-normal-mode-time-based
    permissions:
      contents: read
      actions: write
    env:
      CACHE_KEY: test-created-at-cache-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: create test cache
        run: echo created-at-cache > cache-file.txt

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache-file.txt
          key: ${{ env.CACHE_KEY }}

      - name: wait for the cache to age and verify it exists
        run: |
          sleep 8
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$CACHE_KEY" --json key |
            jq -e --arg key "$CACHE_KEY" 'any(.[]; .key == $key)'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: purge caches using created_at filter (older than 5 seconds)
        uses: ./
        with:
          mode: normal
          debug: "true"
          max-age: 5
          filter-key: created_at
          ref-key: ${{ github.ref }}

      - name: verify cache was deleted
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$CACHE_KEY" --json key |
            jq -e --arg key "$CACHE_KEY" 'all(.[]; .key != $key)'
        env:
          GH_TOKEN: ${{ github.token }}

  test-all-mode:
    name: Test all mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Check the repository-wide delete command without touching real caches.
      - name: stub the GitHub CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fake-bin"
          cat > "$RUNNER_TEMP/fake-bin/gh" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$@" > "$RUNNER_TEMP/cache-delete-args"
          EOF
          chmod +x "$RUNNER_TEMP/fake-bin/gh"
          printf '%s\n' "$RUNNER_TEMP/fake-bin" >> "$GITHUB_PATH"

      - name: purge all caches
        uses: ./
        with:
          mode: all

      - name: verify the repository-wide delete command
        run: |
          printf '%s\n' cache delete --all --repo "$GITHUB_REPOSITORY" --succeed-on-no-caches |
            diff -u - "$RUNNER_TEMP/cache-delete-args"
